<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciador de Tarefas — Demo Claude Code</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Cabeçalho ── -->
  <header class="header">
    <div class="container">
      <h1>📋 Gerenciador de Tarefas</h1>
      <p class="subtitle">Demonstração de projeto fullstack com Claude Code</p>
    </div>
  </header>

  <main class="container">

    <!-- ── Notificação de feedback ── -->
    <div id="toast" class="toast hidden"></div>

    <!-- ── Formulário (criar / editar) ── -->
    <section class="card form-section">
      <h2 id="form-title">Nova Tarefa</h2>
      <form id="task-form">
        <!-- ID oculto: preenchido ao editar -->
        <input type="hidden" id="task-id" />

        <div class="form-group">
          <label for="title">Título <span class="required">*</span></label>
          <input
            type="text"
            id="title"
            placeholder="Ex.: Implementar autenticação"
            required
            maxlength="120"
          />
        </div>

        <div class="form-group">
          <label for="description">Descrição</label>
          <textarea
            id="description"
            rows="3"
            placeholder="Detalhes opcionais sobre a tarefa…"
          ></textarea>
        </div>

        <div class="form-group">
          <label for="status">Status</label>
          <select id="status">
            <option value="pending">⏳ Pendente</option>
            <option value="in_progress">🔄 Em andamento</option>
            <option value="done">✅ Concluída</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">Criar Tarefa</button>
          <button type="button" class="btn btn-secondary hidden" id="cancel-btn">Cancelar</button>
        </div>
      </form>
    </section>

    <!-- ── Filtro e listagem ── -->
    <section class="card list-section">
      <div class="list-header">
        <h2>Tarefas <span id="task-count" class="badge">0</span></h2>
        <div class="filter-group">
          <label for="filter">Filtrar:</label>
          <select id="filter">
            <option value="">Todas</option>
            <option value="pending">⏳ Pendentes</option>
            <option value="in_progress">🔄 Em andamento</option>
            <option value="done">✅ Concluídas</option>
          </select>
        </div>
      </div>

      <!-- Estado vazio -->
      <div id="empty-state" class="empty-state hidden">
        <p>Nenhuma tarefa encontrada.</p>
      </div>

      <!-- Lista de tarefas -->
      <ul id="task-list" class="task-list"></ul>
    </section>

  </main>

  <!-- ── Modal de confirmação de exclusão ── -->
  <div id="confirm-modal" class="modal-overlay hidden">
    <div class="modal">
      <p>Tem certeza que deseja excluir esta tarefa?</p>
      <div class="modal-actions">
        <button id="confirm-delete" class="btn btn-danger">Excluir</button>
        <button id="cancel-delete" class="btn btn-secondary">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
